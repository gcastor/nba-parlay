name: Update player stats

on:
  schedule:
    - cron: "30 9 * * *"   # 4:30 AM Eastern (EST), after the night's games
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull last night's box scores
        run: python scripts/update_stats.py
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/player_logs.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update player stats" && git push; fi
